<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue-Moon 🌙 Catálogo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d23',
                        darkCard: '#101736',
                        accent: {
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            gold: '#f59e0b',
                            rose: '#f43f5e'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d23; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>
</head>
<body class="bg-[#090d23] text-gray-100 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-[#090d23]/80 backdrop-blur-md border-b border-blue-900/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🌙</span>
                <h1 class="text-lg font-extrabold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
                    Blue-Moon
                </h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="window.openAddModal()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-blue-600/20 transition cursor-pointer flex items-center space-x-1.5">
                    <span>+</span>
                    <span>Adicionar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        
        <!-- Stats / Resumo simples -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="stats-container">
            <!-- Preenchido via JS -->
        </div>

        <!-- Filtros e Busca -->
        <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between bg-[#101736]/60 p-3 rounded-2xl border border-blue-900/30">
            <input type="text" id="search-input" placeholder="Pesquisar obra..." oninput="window.handleSearchFilter()" class="bg-[#090d23] text-xs text-white px-3.5 py-2 rounded-xl border border-blue-900/50 focus:outline-none focus:border-blue-500 w-full sm:w-64">
            
            <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0" id="category-tabs">
                <button onclick="window.setCategory('all')" data-cat="all" class="cat-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white cursor-pointer transition shrink-0">Todos</button>
                <button onclick="window.setCategory('Filme')" data-cat="Filme" class="cat-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#090d23] text-blue-200/70 hover:text-white cursor-pointer transition shrink-0">Filmes</button>
                <button onclick="window.setCategory('Série')" data-cat="Série" class="cat-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#090d23] text-blue-200/70 hover:text-white cursor-pointer transition shrink-0">Séries</button>
                <button onclick="window.setCategory('Livro')" data-cat="Livro" class="cat-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#090d23] text-blue-200/70 hover:text-white cursor-pointer transition shrink-0">Livros</button>
                <button onclick="window.setCategory('Mangá')" data-cat="Mangá" class="cat-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#090d23] text-blue-200/70 hover:text-white cursor-pointer transition shrink-0">Mangás</button>
            </div>
        </div>

        <!-- Grid de Mídias -->
        <div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Cards renderizados via JS -->
        </div>
    </main>

    <!-- Modal Detalhes (Estilo Filmow/Letterboxd) -->
    <div id="modal-details" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#101736] border border-blue-500/30 rounded-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl relative" id="details-content">
            <!-- Conteúdo injetado via JS -->
        </div>
    </div>

    <!-- Modal Adicionar / Editar (Simples) -->
    <div id="modal-add" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#101736] border border-blue-500/30 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center pb-2 border-b border-blue-900/40">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider">Adicionar Obra</h3>
                <button onclick="window.closeAddModal()" class="text-xs text-blue-300 hover:text-white cursor-pointer">✕</button>
            </div>
            <form id="media-form" onsubmit="window.saveMedia(event)" class="space-y-3 text-xs">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-blue-300/80 mb-1 font-semibold">Categoria</label>
                        <select name="category" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                            <option value="Filme">Filme</option>
                            <option value="Série">Série</option>
                            <option value="Livro">Livro</option>
                            <option value="Mangá">Mangá</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-blue-300/80 mb-1 font-semibold">Status</label>
                        <select name="status" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                            <option value="completed">Concluído</option>
                            <option value="in-progress">Em Andamento</option>
                            <option value="planned">Quero ver</option>
                            <option value="abandoned">Abandonado</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-blue-300/80 mb-1 font-semibold">Título</label>
                    <input type="text" name="title" required class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-blue-300/80 mb-1 font-semibold">Título Original / Subtítulo</label>
                    <input type="text" name="originalTitle" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-blue-300/80 mb-1 font-semibold">URL da Capa</label>
                        <input type="url" name="cover" required class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-blue-300/80 mb-1 font-semibold">Avaliação (0-10 🌕)</label>
                        <input type="number" step="0.1" min="0" max="10" name="rating" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-blue-300/80 mb-1 font-semibold">Gêneros (vírgula)</label>
                        <input type="text" name="genres" placeholder="Ação, Sci-Fi" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-blue-300/80 mb-1 font-semibold">Diretores / Autores (vírgula)</label>
                        <input type="text" name="directors" placeholder="Christopher Miller" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-blue-300/80 mb-1 font-semibold">Data Lançamento</label>
                        <input type="text" name="releaseDate" placeholder="18 Março 2026" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-blue-300/80 mb-1 font-semibold">Data Visto</label>
                        <input type="text" name="watchDate" placeholder="2026" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" name="season" placeholder="Temp." class="bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                    <input type="text" name="episodes" placeholder="Episódios" class="bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                    <input type="text" name="ovas" placeholder="OVAs" class="bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white">
                </div>
                <div>
                    <label class="block text-blue-300/80 mb-1 font-semibold">Sinopse</label>
                    <textarea name="synopsis" rows="2" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white"></textarea>
                </div>
                <div>
                    <label class="block text-blue-300/80 mb-1 font-semibold">Minha Opinião / Resenha</label>
                    <textarea name="review" rows="2" class="w-full bg-[#090d23] border border-blue-900/50 rounded-xl px-3 py-2 text-white"></textarea>
                </div>
                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" name="favorite" id="fav-check" class="rounded bg-[#090d23] border-blue-900/50">
                    <label for="fav-check" class="font-semibold text-blue-200">Favoritar obra ❤️</label>
                </div>
                <div class="pt-3 border-t border-blue-900/40 flex justify-end gap-2">
                    <button type="button" onclick="window.closeAddModal()" class="px-4 py-2 bg-blue-950/60 text-gray-300 rounded-xl font-semibold cursor-pointer">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-xl font-semibold cursor-pointer">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        let mediaItems = JSON.parse(localStorage.getItem('bluemoon_media_v2')) || [
            {
                id: '1',
                category: 'Filme',
                title: 'Devoradores de Estrelas',
                originalTitle: 'Project Hail Mary',
                cover: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&auto=format&fit=crop&q=60',
                rating: 4.0,
                status: 'completed',
                favorite: true,
                directors: ['Christopher Miller', 'Phil Lord'],
                releaseDate: '18 Março 2026',
                genres: ['Ficção Científica', 'Aventura', 'Drama'],
                synopsis: 'O professor de ciências Ryland Grace acorda em uma espaçonave anos-luz de casa sem memória de quem ele é ou como chegou lá...',
                review: 'Livro/adaptação sensacional!'
            }
        ];

        let currentCategory = 'all';
        let searchQuery = '';

        function renderTagsFromArray(arr) {
            return arr.map(item => `<span class="px-2 py-0.5 rounded-md bg-[#090d23] text-blue-200/90 border border-blue-900/40 text-[11px] font-medium">${item}</span>`).join('');
        }

        window.renderStats = () => {
            const total = mediaItems.length;
            const completed = mediaItems.filter(i => i.status === 'completed').length;
            const favorites = mediaItems.filter(i => i.favorite).length;
            const avgRating = total ? (mediaItems.reduce((acc, i) => acc + (Number(i.rating) || 0), 0) / mediaItems.filter(i => i.rating).length || 0).toFixed(1) : '0.0';

            document.getElementById('stats-container').innerHTML = `
                <div class="bg-[#101736]/70 border border-blue-900/30 rounded-2xl p-3">
                    <span class="text-[10px] uppercase text-blue-300/60 font-semibold block">Total</span>
                    <span class="text-lg font-extrabold text-white">${total}</span>
                </div>
                <div class="bg-[#101736]/70 border border-blue-900/30 rounded-2xl p-3">
                    <span class="text-[10px] uppercase text-blue-300/60 font-semibold block">Concluídos</span>
                    <span class="text-lg font-extrabold text-white">${completed}</span>
                </div>
                <div class="bg-[#101736]/70 border border-blue-900/30 rounded-2xl p-3">
                    <span class="text-[10px] uppercase text-blue-300/60 font-semibold block">Favoritos</span>
                    <span class="text-lg font-extrabold text-white">${favorites} ❤️</span>
                </div>
                <div class="bg-[#101736]/70 border border-blue-900/30 rounded-2xl p-3">
                    <span class="text-[10px] uppercase text-blue-300/60 font-semibold block">Média Nota</span>
                    <span class="text-lg font-extrabold text-amber-400">🌕 ${avgRating}</span>
                </div>
            `;
        };

        window.renderMediaGrid = () => {
            const filtered = mediaItems.filter(item => {
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            const grid = document.getElementById('media-grid');
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-xs text-blue-300/60">Nenhuma obra encontrada.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div onclick="window.openDetailsModal('${item.id}')" class="group bg-[#101736] border border-blue-900/40 rounded-2xl overflow-hidden cursor-pointer hover:border-blue-500/50 transition flex flex-col shadow-lg">
                    <div class="aspect-[2/3] w-full overflow-hidden bg-[#090d23] relative">
                        <img src="${item.cover}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        ${item.favorite ? `<span class="absolute top-2 right-2 bg-black/60 backdrop-blur-md p-1 rounded-full text-xs">❤️</span>` : ''}
                        ${item.rating ? `<span class="absolute bottom-2 left-2 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-400">🌕 ${item.rating}</span>` : ''}
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[9px] uppercase tracking-wider text-blue-300/60 font-semibold">${item.category}</span>
                            <h3 class="text-xs font-bold text-white leading-snug line-clamp-1 mt-0.5">${item.title}</h3>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.setCategory = (cat) => {
            currentCategory = cat;
            document.querySelectorAll('.cat-tab').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = 'cat-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white cursor-pointer transition shrink-0';
                } else {
                    btn.className = 'cat-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#090d23] text-blue-200/70 hover:text-white cursor-pointer transition shrink-0';
                }
            });
            window.renderMediaGrid();
        };

        window.handleSearchFilter = () => {
            searchQuery = document.getElementById('search-input').value;
            window.renderMediaGrid();
        };

        window.openDetailsModal = (id) => {
            const item = mediaItems.find(i => i.id === id);
            if (!item) return;

            const genresList = item.genres || [];
            const directorsList = item.directors || [];

            const statusMap = {
                'completed': 'Concluído',
                'in-progress': 'Em Andamento',
                'planned': 'Quero ver',
                'abandoned': 'Abandonado'
            };

            document.getElementById('details-content').innerHTML = `
                <div class="flex flex-wrap items-center gap-1.5 pb-3 border-b border-blue-900/40 text-xs">
                    <span class="px-2.5 py-1 rounded-lg bg-blue-600/30 text-blue-200 border border-blue-500/30 font-medium">
                        ✓ ${statusMap[item.status] || 'Status'}
                    </span>
                    <button onclick="window.toggleFavoriteModal('${item.id}')" class="px-2.5 py-1 rounded-lg bg-[#0e1738] hover:bg-blue-950/60 text-gray-200 border border-blue-900/50 flex items-center space-x-1 cursor-pointer">
                        <span>${item.favorite ? '❤️ Favorito' : '🤍 Favoritar'}</span>
                    </button>
                </div>

                <div class="flex flex-col sm:flex-row gap-5 pt-2">
                    <div class="w-36 shrink-0 mx-auto sm:mx-0">
                        <div class="aspect-[2/3] rounded-xl overflow-hidden border border-blue-500/30 shadow-lg">
                            <img src="${item.cover}" class="w-full h-full object-cover" alt="${item.title}">
                        </div>
                    </div>
                    
                    <div class="flex-1 space-y-3">
                        <div>
                            <h4 class="text-xl font-extrabold text-white leading-tight">${item.title}</h4>
                            ${item.originalTitle ? `<p class="text-xs text-blue-300/70 italic mt-0.5">${item.originalTitle}</p>` : ''}
                        </div>

                        ${item.rating ? `
                            <div class="bg-[#0e1738]/80 border border-blue-500/30 rounded-xl p-3 flex items-center justify-between">
                                <div>
                                    <span class="block text-[10px] font-bold text-blue-300 uppercase tracking-wider">Minha Avaliação</span>
                                    <div class="flex items-center space-x-1.5 text-amber-400 font-bold text-sm mt-0.5">
                                        <span>🌕</span><span>${item.rating} / 10</span>
                                    </div>
                                </div>
                                <span class="text-xs text-blue-200/60 uppercase font-semibold">${item.category}</span>
                            </div>
                        ` : ''}

                        <div class="space-y-2 text-xs pt-1">
                            ${directorsList.length ? `<div><span class="text-blue-300/70 block text-[11px] font-semibold uppercase">Dirigido / Criado por</span><div class="mt-1 flex flex-wrap gap-1">${renderTagsFromArray(directorsList)}</div></div>` : ''}
                            ${item.releaseDate ? `<div><span class="text-blue-300/70 block text-[10px] uppercase font-semibold">Lançamento</span><span class="text-gray-200 font-medium">${item.releaseDate}</span></div>` : ''}
                        </div>
                    </div>
                </div>

                ${genresList.length ? `<div class="space-y-1 pt-2"><span class="text-xs font-semibold text-blue-300/70 uppercase">Gênero</span><div class="flex flex-wrap gap-1.5 pt-1">${renderTagsFromArray(genresList)}</div></div>` : ''}
                ${item.synopsis ? `<div class="space-y-1.5 pt-2 border-t border-blue-900/30"><strong class="text-xs font-semibold text-blue-200 uppercase tracking-wider">Sinopse</strong><p class="text-xs text-blue-200/90 leading-relaxed">${item.synopsis}</p></div>` : ''}
                ${item.review ? `<div class="space-y-1.5 pt-2"><strong class="text-xs font-semibold text-blue-200 uppercase tracking-wider">Minha Opinião</strong><p class="text-xs text-amber-200/90 leading-relaxed bg-[#0e1738]/50 p-3 rounded-xl border border-blue-900/30 italic">"${item.review}"</p></div>` : ''}

                <div class="pt-4 border-t border-blue-900/40 flex justify-between items-center">
                    <button onclick="window.deleteMedia('${item.id}')" class="px-3.5 py-2 bg-rose-600/25 hover:bg-rose-600/35 text-rose-300 text-xs font-semibold rounded-xl cursor-pointer transition">Excluir obra</button>
                    <button onclick="window.closeDetailsModal()" class="px-4 py-2 bg-blue-950/60 hover:bg-blue-900/60 text-gray-200 text-xs font-semibold rounded-xl cursor-pointer transition">Fechar</button>
                </div>
            `;
            document.getElementById('modal-details').classList.remove('hidden');
        };

        window.closeDetailsModal = () => document.getElementById('modal-details').classList.add('hidden');
        window.openAddModal = () => document.getElementById('modal-add').classList.remove('hidden');
        window.closeAddModal = () => document.getElementById('modal-add').classList.add('hidden');

        window.toggleFavoriteModal = (id) => {
            const index = mediaItems.findIndex(i => i.id === id);
            if (index === -1) return;
            mediaItems[index].favorite = !mediaItems[index].favorite;
            localStorage.setItem('bluemoon_media_v2', JSON.stringify(mediaItems));
            window.renderStats();
            window.renderMediaGrid();
            window.openDetailsModal(id);
        };

        window.saveMedia = (e) => {
            e.preventDefault();
            const form = e.target;
            const newItem = {
                id: Date.now().toString(),
                category: form.category.value,
                status: form.status.value,
                title: form.title.value,
                originalTitle: form.originalTitle.value,
                cover: form.cover.value,
                rating: form.rating.value ? parseFloat(form.rating.value) : null,
                genres: form.genres.value ? form.genres.value.split(',').map(s => s.trim()) : [],
                directors: form.directors.value ? form.directors.value.split(',').map(s => s.trim()) : [],
                releaseDate: form.releaseDate.value,
                watchDate: form.watchDate.value,
                season: form.season.value,
                episodes: form.episodes.value,
                ovas: form.ovas.value,
                synopsis: form.synopsis.value,
                review: form.review.value,
                favorite: form.favorite.checked
            };
            mediaItems.unshift(newItem);
            localStorage.setItem('bluemoon_media_v2', JSON.stringify(mediaItems));
            window.closeAddModal();
            window.renderStats();
            window.renderMediaGrid();
            form.reset();
        };

        window.deleteMedia = (id) => {
            if (!confirm('Deseja realmente excluir esta obra?')) return;
            mediaItems = mediaItems.filter(i => i.id !== id);
            localStorage.setItem('bluemoon_media_v2', JSON.stringify(mediaItems));
            window.closeDetailsModal();
            window.renderStats();
            window.renderMediaGrid();
        };

        // Inicialização
        window.renderStats();
        window.renderMediaGrid();
    </script>
</body>
</html>
